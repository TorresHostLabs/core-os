name: Imagem do painel

# Constrói a imagem Docker do painel e publica no GHCR (ghcr.io/<dono>/<repo>).
# O servidor (Dokploy) só puxa a imagem pronta: nada é compilado nele.
#
# A imagem só é criada quando uma VERSÃO é publicada (tag vMAJOR.MINOR.PATCH), nunca por push na main nem manualmente.
# Para lançar:  git tag v1.0.0 && git push origin v1.0.0   (ou GitHub › Releases › Draft a new release, criando a tag).
# Economia de minutos: nada roda fora das versões, e o cache do GitHub Actions reaproveita as camadas que não mudaram.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write # renomeia a release com o codinome
  packages: write

concurrency:
  group: imagem-${{ github.ref }}
  cancel-in-progress: true

jobs:
  imagem:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # cada versão tem um codinome (personagem da DC ou de Star Wars) reservado em VERSOES.md
      # (versão especial vX.Y.0: um protagonista). Sem reserva pra versão, o build falha.
      - name: Codinome da versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$GITHUB_REF_NAME
          erro="${RUNNER_TEMP:-/tmp}/codinome-erro.txt"
          r=$(./versao.sh codinome "$tag" 2>"$erro") || { echo "::error::$(cat "$erro")"; exit 1; }
          IFS=$'\t' read -r codinome universo origem <<<"$r"
          echo "CODINOME=$codinome" >> "$GITHUB_ENV"
          echo "### $tag · $codinome ($universo)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$origem" = reserva ]; then
            echo "::warning::$tag ainda não está na tabela de versões de VERSOES.md: usei $codinome, o nome reservado pra ela. Registre com ./versao.sh registrar ${tag%%-*} \"o que mudou\" e faça o merge na main."
            echo "Nome da reserva. Registre na tabela de VERSOES.md: \`./versao.sh registrar ${tag%%-*} \"o que mudou\"\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          # título da release com o codinome (se a tag veio de uma release)
          if rel=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '[.id, .name] | @tsv' 2>/dev/null); then
            IFS=$'\t' read -r id nome <<<"$rel"
            [ "$nome" = "$tag · $codinome" ] || gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -f name="$tag · $codinome" >/dev/null
          fi

      - name: Nome da imagem em minúsculas (o GHCR exige)
        run: echo "IMAGEM=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGEM }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      # 1) constrói e carrega localmente, sem publicar, pra testar antes
      - name: Construir (sem publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: core-os-teste
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Subir e conferir
        run: |
          set -e
          docker run -d --name teste -p 3000:3000 -e CORE_OS_PASSWORD=ci-teste-123 core-os-teste
          ok=0
          for i in $(seq 1 40); do
            if curl -fs http://127.0.0.1:3000/api/eu | grep -q '"logado":false'; then ok=1; break; fi
            sleep 1
          done
          [ "$ok" = 1 ] || { echo "O painel não subiu:"; docker logs teste; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/api/login -H 'content-type: application/json' -d '{"senha":"ci-teste-123"}')" = 200
          docker exec teste codex --version
          docker rm -f teste

      # 2) só publica se o teste passou (as camadas vêm do cache, então é rápido)
      - name: Publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.ref.name=${{ github.ref_name }} · ${{ env.CODINOME }}
            io.coreos.codinome=${{ env.CODINOME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
