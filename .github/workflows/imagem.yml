name: Imagem do painel

# Constrói a imagem Docker do painel e publica no GHCR (ghcr.io/<dono>/<repo>).
# O servidor (Dokploy) só puxa a imagem pronta: nada é compilado nele.
#
# Economia de minutos: só roda quando o painel muda na main, em tags v* ou manualmente,
# e o cache do GitHub Actions reaproveita as camadas que não mudaram.
on:
  push:
    branches: [main]
    paths:
      - 'painel/**'
      - 'cerebro-demo/**'
      - 'Dockerfile'
      - 'docker/**'
      - '.dockerignore'
      - '.github/workflows/imagem.yml'
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: imagem-${{ github.ref }}
  cancel-in-progress: true

jobs:
  imagem:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Nome da imagem em minúsculas (o GHCR exige)
        run: echo "IMAGEM=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGEM }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=sha,format=short

      # 1) constrói e carrega localmente, sem publicar, pra testar antes
      - name: Construir (sem publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: core-os-teste
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Subir e conferir
        run: |
          set -e
          docker run -d --name teste -p 3000:3000 -e CORE_OS_PASSWORD=ci-teste-123 core-os-teste
          ok=0
          for i in $(seq 1 40); do
            if curl -fs http://127.0.0.1:3000/api/eu | grep -q '"logado":false'; then ok=1; break; fi
            sleep 1
          done
          [ "$ok" = 1 ] || { echo "O painel não subiu:"; docker logs teste; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/api/login -H 'content-type: application/json' -d '{"senha":"ci-teste-123"}')" = 200
          docker exec teste codex --version
          docker rm -f teste

      # 2) só publica se o teste passou (as camadas vêm do cache, então é rápido)
      - name: Publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
