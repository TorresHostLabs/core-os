name: Imagem do painel

# Constrói a imagem Docker do painel e publica no GHCR (ghcr.io/<dono>/<repo>).
# O servidor (Dokploy) só puxa a imagem pronta: nada é compilado nele.
#
# A imagem só é criada quando uma VERSÃO é publicada (tag vMAJOR.MINOR.PATCH), nunca por push na main nem manualmente.
# Para lançar:  git tag v1.0.0 && git push origin v1.0.0   (ou GitHub › Releases › Draft a new release, criando a tag).
# Economia de minutos: nada roda fora das versões, e o cache do GitHub Actions reaproveita as camadas que não mudaram.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read
  packages: write

concurrency:
  group: imagem-${{ github.ref }}
  cancel-in-progress: true

jobs:
  imagem:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # cada versão tem um codinome (personagem da DC ou de Star Wars) registrado em VERSOES.md
      - name: Codinome da versão
        run: |
          set -e
          # colunas da tabela (sem espaços nas pontas): versão, codinome, universo
          tabela=$(awk -F'|' '/^\| *v[0-9]/ { for (i = 2; i <= 4; i++) gsub(/^ +| +$/, "", $i); print $2 "\t" $3 "\t" $4 }' VERSOES.md)
          linha=$(printf '%s\n' "$tabela" | awk -F'\t' -v v="$GITHUB_REF_NAME" '$1 == v')
          [ -n "$linha" ] || { echo "::error::A versão $GITHUB_REF_NAME não está em VERSOES.md. Acrescente a linha (codinome DC ou Star Wars) e crie a tag de novo."; exit 1; }
          codinome=$(printf '%s' "$linha" | cut -f2)
          universo=$(printf '%s' "$linha" | cut -f3)
          [ -n "$codinome" ] || { echo "::error::Falta o codinome de $GITHUB_REF_NAME em VERSOES.md."; exit 1; }
          case "$universo" in DC|"Star Wars") ;; *) echo "::error::Universo \"$universo\" inválido em VERSOES.md: use DC ou Star Wars."; exit 1;; esac
          repetidos=$(printf '%s\n' "$tabela" | cut -f2 | tr '[:upper:]' '[:lower:]' | sort | uniq -d)
          [ -z "$repetidos" ] || { echo "::error::Codinome repetido em VERSOES.md: $repetidos"; exit 1; }
          echo "CODINOME=$codinome" >> "$GITHUB_ENV"
          echo "### $GITHUB_REF_NAME · $codinome ($universo)" >> "$GITHUB_STEP_SUMMARY"

      - name: Nome da imagem em minúsculas (o GHCR exige)
        run: echo "IMAGEM=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGEM }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      # 1) constrói e carrega localmente, sem publicar, pra testar antes
      - name: Construir (sem publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: core-os-teste
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Subir e conferir
        run: |
          set -e
          docker run -d --name teste -p 3000:3000 -e CORE_OS_PASSWORD=ci-teste-123 core-os-teste
          ok=0
          for i in $(seq 1 40); do
            if curl -fs http://127.0.0.1:3000/api/eu | grep -q '"logado":false'; then ok=1; break; fi
            sleep 1
          done
          [ "$ok" = 1 ] || { echo "O painel não subiu:"; docker logs teste; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/api/login -H 'content-type: application/json' -d '{"senha":"ci-teste-123"}')" = 200
          docker exec teste codex --version
          docker rm -f teste

      # 2) só publica se o teste passou (as camadas vêm do cache, então é rápido)
      - name: Publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.ref.name=${{ github.ref_name }} · ${{ env.CODINOME }}
            io.coreos.codinome=${{ env.CODINOME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
